<!doctype html>
<meta charset="utf-8">
<title>Hand</title>
<style>body{margin:0;background:#000;color:#555;font:16px sans-serif;text-align:center;padding-top:40vh}</style>
<div id="s">...</div>
<video id="v" playsinline muted style="display:none"></video>
<script src="fingers.js"></script>
<script type="module">
// 平板上常开的页面：答题页在前台时才开摄像头，画面只在本机识别，只把手指数发给服务
import { FilesetResolver, HandLandmarker } from "./vision_bundle.mjs";
const s = document.getElementById("s"), v = document.getElementById("v");
const tiny = Object.assign(document.createElement("canvas"), { width: 8, height: 8 }).getContext("2d", { willReadFrequently: true });
let detector = null, stream = null, last = -1;

function say(text) {
  s.textContent = text;
  fetch("/api/hand_status", { method: "POST", body: JSON.stringify({ text }) }).catch(() => {});
}
function post(fingers) {
  return fetch("/api/gesture", { method: "POST", body: JSON.stringify({ fingers }) }).catch(() => {});
}
async function start() {
  if (!detector) {
    say("loading model");
    const files = await FilesetResolver.forVisionTasks("wasm");
    detector = await HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: "hand_landmarker.task" }, runningMode: "VIDEO", numHands: 1,
      minHandDetectionConfidence: 0.3, minHandPresenceConfidence: 0.3, minTrackingConfidence: 0.3 });
  }
  say("asking camera");
  stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" }, audio: false });
  v.srcObject = stream;
  await v.play();
  say("camera on");
  loop();
}
function stop() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  v.srcObject = null;
  say("camera off");
}
async function loop() {
  if (!stream) return;
  if (v.currentTime !== last) {
    last = v.currentTime;
    // 只报亮度和分辨率：不看画面也能判断摄像头是否被挡、是否太暗
    tiny.drawImage(v, 0, 0, 8, 8);
    const px = tiny.getImageData(0, 0, 8, 8).data;
    let sum = 0;
    for (let i = 0; i < px.length; i += 4) sum += px[i] + px[i + 1] + px[i + 2];
    say(`frame ${Math.round(last)} ${v.videoWidth}x${v.videoHeight} bright ${Math.round(sum / 192)}`);
    const r = detector.detectForVideo(v, performance.now());
    await post(r.landmarks.length ? countFingers(r.landmarks[0]) : 0);
  }
  setTimeout(loop, 500);  // 这台平板的芯片旧，高频识别可能把它拖垮
}
let busy = false;
async function tick() {
  if (busy) return;
  busy = true;
  try {
    const g = await (await fetch("/api/gesture")).json();
    if (g.active && !stream) await start();
    else if (!g.active && stream) stop();
    else if (!stream) say("camera off");
  } catch (e) { say(String(e)); }
  busy = false;
}
// 屏幕一灭页面就停，所以要常亮；页面是黑的
async function keepAwake() {
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
keepAwake();
setInterval(tick, 2000);
tick();
</script>
