<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电视家长面板</title>
<style>
  :root { --bg: #f4f5fb; --card: #fff; --text: #1d2150; --muted: #6b6f8f; --accent: #5b4cf0; --good: #1f9d5c;
          --warn: #d9822b; --bad: #d33; --line: #e4e6f2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14162b; --card: #1f2240; --text: #eef0ff; --muted: #9aa0c8; --line: #33375e; } }
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 28px auto; padding: 0 16px; }
  h1 { font-size: 24px; margin: 0 0 14px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  nav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  nav button { flex: 0 0 auto; background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 8px 16px; }
  nav button.on { background: var(--accent); color: #fff; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #mode { font-size: 22px; font-weight: bold; }
  .paused { color: var(--warn); } .active { color: var(--good); }
  .muted { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
  button { font: inherit; font-size: 16px; padding: 11px 16px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; flex: 1 1 110px; }
  button.secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--bad); margin-top: 8px; min-height: 1em; }
  .ok { color: var(--good); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .tile { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: normal; }
  td.num, th.num { text-align: right; }
  .r-ok { color: var(--good); } .r-wrong { color: var(--bad); } .r-skip { color: var(--warn); }
  .scroll { overflow-x: auto; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; margin: 4px 14px 4px 0; font-size: 15px; }
  select, input[type=number] { font: inherit; font-size: 16px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); width: 90px; }
  .field { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 12px; }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>📺 电视家长面板</h1>
  <nav>
    <button data-tab="home" class="on">总览</button>
    <button data-tab="stats">答题统计</button>
    <button data-tab="bank">题库设置</button>
    <button data-tab="update">更新</button>
  </nav>

  <section id="tab-home">
    <div class="card">
      <div id="mode">读取中…</div>
      <div class="muted" id="detail"></div>
    </div>
    <div class="card">
      <h2>暂停刷题（投屏、家长自己用电视时）</h2>
      <div class="muted">暂停期间不会跳出答题页，也不扣孩子的看电视时间。时间到了自动恢复。</div>
      <div class="row">
        <button data-min="30">30 分钟</button>
        <button data-min="60">1 小时</button>
        <button data-min="120">2 小时</button>
        <button data-min="240">4 小时</button>
      </div>
      <div class="row"><button class="secondary" data-min="0">马上恢复刷题</button></div>
    </div>
    <div class="card">
      <h2>给孩子加减时间（只算今天）</h2>
      <div class="row">
        <button data-grant="10">+10 分钟</button>
        <button data-grant="30">+30 分钟</button>
        <button data-grant="60">+1 小时</button>
        <button class="secondary" data-grant="-10">−10 分钟</button>
      </div>
    </div>
  </section>

  <section id="tab-stats" hidden>
    <div class="card">
      <h2>今天</h2>
      <div class="tiles" id="today"></div>
    </div>
    <div class="card scroll">
      <h2>最近 7 天</h2>
      <table id="days"></table>
    </div>
    <div class="card scroll">
      <h2>按科目（7 天）</h2>
      <table id="subjects"></table>
    </div>
    <div class="card scroll">
      <h2>最近 30 道题</h2>
      <table id="recent"></table>
      <div class="muted" id="retired"></div>
    </div>
  </section>

  <section id="tab-bank" hidden>
    <div class="card">
      <h2>难度和时间</h2>
      <div class="field"><span>年级</span><select id="grade"></select></div>
      <div class="field"><span>加难（只出本年级和上一年级、难度往上挪一档）</span><input type="checkbox" id="harder"></div>
      <div class="field"><span>每天基础时间（分钟，不答题就能看）</span><input type="number" id="dailyMinutes" min="0" max="600"></div>
      <div class="field"><span>每天答题最多赚（分钟，0 = 不限）</span><input type="number" id="dailyEarnCap" min="0" max="600"></div>
      <div class="muted" id="scoring"></div>
    </div>
    <div class="card">
      <h2>科目</h2>
      <div id="subjectList"></div>
      <div class="row"><button id="save">保存，马上生效</button></div>
      <div class="muted" id="bankInfo"></div>
      <div class="err" id="bankErr"></div>
    </div>
  </section>

  <section id="tab-update" hidden>
    <div class="card">
      <h2>程序和题库版本</h2>
      <div id="version" class="muted">读取中…</div>
      <div class="row"><button id="updateBtn">检查并更新</button></div>
      <div class="muted">从 GitHub 拉最新的程序和题库。有新版本会自动重启答题服务（几秒钟），孩子的时间和记录不受影响。</div>
      <div id="updateResult"></div>
    </div>
  </section>

  <div class="err" id="err"></div>
</main>
<script>
  var DIFF = { easy: "简单", medium: "中等", hard: "难" };
  var RESULT = { ok: "✔ 对", wrong: "✘ 错", skip: "跳过" };
  function $(id) { return document.getElementById(id); }
  function api(path, body) {
    var opt = body === undefined ? { cache: "no-store" }
      : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    return fetch(path, opt).then(function (r) { return r.json(); }).then(function (j) {
      $("err").textContent = j.error || ""; return j;
    }, function (e) { $("err").textContent = "连不上答题服务"; throw e; });
  }
  function fmt(n) { return (Math.round(n * 10) / 10).toString(); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // ---- 总览 ----
  function render(s) {
    if (s.error) return;
    var mode = $("mode");
    if (s.pausedFor > 0) {
      mode.className = "paused"; mode.textContent = "⏸ 刷题已暂停，还剩 " + s.pausedFor + " 分钟";
    } else {
      mode.className = "active";
      mode.textContent = s.locked ? "🔒 电视已锁：要答题赚时间" : "▶ 正常：孩子还有时间可以看";
    }
    $("detail").textContent = "今天余额 " + fmt(s.remaining) + " 分钟 · 已看 " + s.used + " 分钟 · 答题赚了 "
      + fmt(s.earnedToday) + " 分钟 · 基础时间 " + s.limit + " 分钟";
  }
  function load() { api("/api/parent").then(render); }
  Array.prototype.forEach.call(document.querySelectorAll("[data-min]"), function (b) {
    b.onclick = function () { api("/api/parent/pause", { minutes: +b.dataset.min }).then(render); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-grant]"), function (b) {
    b.onclick = function () { api("/api/parent/grant", { minutes: +b.dataset.grant }).then(render); };
  });

  // ---- 统计 ----
  function rateOf(s) { return s.answered - s.skipped ? Math.round(100 * s.correct / (s.answered - s.skipped)) + "%" : "–"; }
  function sumRow(label, s) {
    return "<tr><td>" + esc(label) + "</td><td class=num>" + s.answered + "</td><td class=num>" + s.correct
      + "</td><td class=num>" + rateOf(s) + "</td><td class=num>" + s.skipped + "</td><td class=num>+" + fmt(s.earned)
      + "</td><td class=num>−" + fmt(s.lost) + "</td></tr>";
  }
  var HEAD = "<th class=num>答题</th><th class=num>答对</th><th class=num>正确率</th><th class=num>跳过</th><th class=num>赚</th><th class=num>扣</th>";
  var EMPTY = "<tr><td colspan=7 class=muted>还没有记录</td></tr>";
  function loadStats() {
    api("/api/parent/stats").then(function (s) {
      var t = s.today;
      $("today").innerHTML = [["答题", t.answered], ["答对", t.correct], ["正确率", rateOf(t)], ["跳过", t.skipped],
        ["赚到分钟", "+" + fmt(t.earned)], ["扣掉分钟", "−" + fmt(t.lost)]].map(function (x) {
          return "<div class=tile><b>" + x[1] + "</b><span>" + x[0] + "</span></div>"; }).join("");
      $("days").innerHTML = "<tr><th>日期</th>" + HEAD + "</tr>" + (s.days.map(function (d) { return sumRow(d.day, d); }).join("") || EMPTY);
      $("subjects").innerHTML = "<tr><th>科目</th>" + HEAD + "</tr>" + (s.subjects.map(function (d) { return sumRow(d.subject, d); }).join("") || EMPTY);
      $("recent").innerHTML = "<tr><th>时间</th><th>科目</th><th>难度</th><th>结果</th><th class=num>分钟</th></tr>"
        + (s.recent.map(function (r) {
          return "<tr title='" + esc(r.id) + "'><td>" + r.time + "</td><td>" + esc(r.subject) + "</td><td>" + (DIFF[r.difficulty] || esc(r.difficulty))
            + "</td><td class='r-" + r.result + "'>" + RESULT[r.result] + "</td><td class=num>" + (r.delta > 0 ? "+" : "") + fmt(r.delta) + "</td></tr>";
        }).join("") || "<tr><td colspan=5 class=muted>还没有记录</td></tr>");
      $("retired").textContent = "已经掌握、不再出现的题：" + s.retired + " 道（答对 5 次或连续答对 3 次）。统计从这次更新开始记录。";
    });
  }

  // ---- 题库 ----
  function loadSettings() {
    api("/api/parent/settings").then(function (s) {
      var g = $("grade"), opts = "";
      for (var i = 1; i <= 10; i++) opts += "<option value=" + i + (i === s.grade ? " selected" : "") + ">" + i + " 年级</option>";
      g.innerHTML = opts;
      $("harder").checked = s.harder;
      $("dailyMinutes").value = s.dailyMinutes;
      $("dailyEarnCap").value = s.dailyEarnCap;
      $("subjectList").innerHTML = s.allSubjects.map(function (x) {
        return "<label class=chk><input type=checkbox value='" + esc(x.key) + "'" + (s.subjects.indexOf(x.key) >= 0 ? " checked" : "")
          + "> " + esc(x.label) + "</label>"; }).join("");
      var r = s.rewards;
      $("scoring").textContent = "计分：简单 +" + fmt(r.easy) + " / −" + fmt(r.easy * 2) + "，中等 +" + fmt(r.medium) + " / −" + fmt(r.medium)
        + "，难 +" + fmt(r.hard) + " / −" + fmt(r.hard / 2) + "，阅读每小题 +" + fmt(s.rewardReading) + " / −" + fmt(s.rewardReading)
        + "，跳过 −" + fmt(r.easy) + "（和手机一样）。";
      $("bankInfo").textContent = "现在题库里能出的题：" + s.bankSize + " 道（另有数学自动出题）。";
    });
  }
  $("save").onclick = function () {
    var subs = Array.prototype.map.call(document.querySelectorAll("#subjectList input:checked"), function (x) { return x.value; });
    $("save").disabled = true;
    api("/api/parent/settings", { grade: +$("grade").value, harder: $("harder").checked, subjects: subs,
      dailyMinutes: +$("dailyMinutes").value, dailyEarnCap: +$("dailyEarnCap").value }).then(function (s) {
      $("save").disabled = false;
      $("bankErr").innerHTML = s.error ? esc(s.error) : "<span class=ok>已保存，下一题就按新设置出。</span>";
      if (!s.error) loadSettings();
    }, function () { $("save").disabled = false; });
  };

  // ---- 更新 ----
  function loadVersion() { api("/api/parent/version").then(function (v) { $("version").textContent = "当前版本：" + v.version; }); }
  $("updateBtn").onclick = function () {
    $("updateBtn").disabled = true; $("updateResult").innerHTML = "<div class=muted>正在更新…</div>";
    api("/api/parent/update", {}).then(function (r) {
      var msg = !r.ok ? "<div class=err>更新失败</div>"
        : r.changed ? "<div class=ok>已更新到 " + esc(r.after) + "，答题服务几秒后自动重启。</div>"
        : "<div class=ok>已经是最新版本。</div>";
      $("updateResult").innerHTML = msg + "<pre>" + esc(r.output || "") + "</pre>";
      setTimeout(function () { $("updateBtn").disabled = false; loadVersion(); load(); }, r.changed ? 8000 : 500);
    }, function () { $("updateBtn").disabled = false; });
  };

  // ---- 标签页 ----
  var loaders = { home: load, stats: loadStats, bank: loadSettings, update: loadVersion };
  var current = "home";
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
    b.onclick = function () {
      current = b.dataset.tab;
      Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (x) { x.classList.toggle("on", x === b); });
      ["home", "stats", "bank", "update"].forEach(function (t) { $("tab-" + t).hidden = t !== current; });
      loaders[current]();
    };
  });
  load();
  setInterval(function () { if (current === "home") load(); if (current === "stats") loadStats(); }, 20000);
</script>
</body>
</html>
