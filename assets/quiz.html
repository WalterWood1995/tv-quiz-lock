<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  /* 电视 1920×1080，遥控器操作：大字、强焦点框、不依赖外网资源 */
  :root {
    --bg1: #1b1350; --bg2: #0b2a5c; --panel: rgba(255,255,255,0.10); --line: rgba(255,255,255,0.22);
    --text: #ffffff; --muted: #c9d4ff; --accent: #ffcf3f; --good: #3ee08a; --bad: #ff6b7d; --focus: #ffe066;
    --robot: #7fd8ff; --robot-dark: #3aa6dd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text);
    font-family: "Samsung One", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  body { overflow: hidden; background: radial-gradient(1200px 800px at 15% 20%, #3b2a9a 0%, transparent 60%),
    radial-gradient(1000px 700px at 90% 90%, #0f5aa0 0%, transparent 60%), linear-gradient(135deg, var(--bg1), var(--bg2)); }
  #sky { position: fixed; inset: 0; pointer-events: none; }
  .star { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .5;
    animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }

  #app { position: relative; display: flex; height: 100%; padding: 36px 56px; gap: 40px; }

  /* 左边：小机器人和对话气泡 */
  #buddy { width: 520px; flex: none; display: none; flex-direction: column; align-items: center; }
  body.robot #buddy { display: flex; animation: slidein .45s ease-out; }
  @keyframes slidein { from { transform: translateX(-600px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  #bubble { position: relative; width: 100%; min-height: 230px; background: #fff; color: #1d2150; border-radius: 36px;
    padding: 28px 34px; font-size: 32px; line-height: 1.4; white-space: pre-line; box-shadow: 0 12px 0 rgba(0,0,0,.18); }
  #bubble:after { content: ""; position: absolute; left: 50%; bottom: -34px; margin-left: -30px;
    border: 34px solid transparent; border-top-color: #fff; border-bottom: 0; }
  #bubble .name { display: block; font-size: 24px; color: #6b5cff; font-weight: bold; margin-bottom: 6px; }
  #robot { width: 440px; height: 520px; margin-top: 40px; animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  #robot.happy { animation: jump .5s ease-in-out 3; }
  @keyframes jump { 0%,100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-70px) rotate(-6deg); }
    70% { transform: translateY(-30px) rotate(5deg); } }
  #robot.sad { animation: shake .6s ease-in-out 2; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
  #eyes { animation: blink 4s infinite; transform-origin: 220px 190px; }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  #mouth-talk { display: none; }
  #robot.talking #mouth-talk { display: inline; animation: talk .22s ease-in-out infinite alternate; transform-origin: 220px 262px; }
  #robot.talking #mouth-smile { display: none; }
  #robot.talking .c-mouth { animation: talk .22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes talk { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  #bulb { animation: glow 1.6s ease-in-out infinite alternate; }
  @keyframes glow { from { fill: #ffcf3f; } to { fill: #ff7ad9; } }
  #robot.sad #bulb { animation: none; fill: #8899aa; }
  #robot.sad #cheeks { opacity: 0; }
  #arm-r { transform-origin: 340px 330px; }
  #robot.happy #arm-r { animation: wave .25s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(0); } to { transform: rotate(-35deg); } }

  /* 右边：答题区 */
  #main { flex: 1; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 56px; color: var(--accent); letter-spacing: 3px; text-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #status { font-size: 30px; color: var(--muted); text-align: right; }
  #status b { color: var(--text); font-size: 44px; }
  #stars { font-size: 30px; color: var(--accent); letter-spacing: 4px; min-height: 36px; }
  .row { display: flex; gap: 18px; }
  .nav { cursor: pointer; border: 5px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 24px; font: inherit; outline: none; transition: transform .1s, box-shadow .1s; }
  .nav:focus { border-color: var(--focus); transform: scale(1.04); box-shadow: 0 0 0 6px rgba(255,224,102,.25), 0 0 40px rgba(255,224,102,.5); }
  .diff { flex: 1; padding: 12px; font-size: 30px; line-height: 1.3; }
  .diff.sel { background: rgba(255,207,63,.25); border-color: var(--accent); }
  .diff small { display: block; font-size: 22px; color: var(--muted); }
  #card { background: rgba(255,255,255,.95); color: #1d2150; border-radius: 32px; padding: 26px 36px;
    box-shadow: 0 10px 0 rgba(0,0,0,.2); }
  #meta { font-size: 26px; color: #6b5cff; font-weight: bold; }
  #stem { font-size: 50px; margin-top: 8px; line-height: 1.3; min-height: 130px; }
  #options { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .opt { padding: 18px 26px; font-size: 40px; text-align: left; min-height: 104px; display: flex; align-items: center; }
  .opt .k { flex: none; display: inline-block; width: 64px; height: 64px; line-height: 64px; text-align: center;
    border-radius: 50%; margin-right: 20px; font-size: 34px; font-weight: bold; color: #1d2150; }
  .opt:nth-child(1) .k { background: #ff8fab; } .opt:nth-child(2) .k { background: #7fd8ff; }
  .opt:nth-child(3) .k { background: #ffd166; } .opt:nth-child(4) .k { background: #8ef0a8; }
  .opt.good { border-color: var(--good); background: rgba(62,224,138,.35); }
  .opt.bad { border-color: var(--bad); background: rgba(255,107,125,.35); }
  #actions { display: flex; gap: 18px; align-items: center; }
  .act { padding: 16px 34px; font-size: 32px; white-space: nowrap; }
  #next { background: rgba(255,207,63,.3); }
  #unlocked { display: none; font-size: 34px; color: var(--good); }
  #feedback { font-size: 40px; min-height: 52px; font-weight: bold; }
  #feedback.good { color: var(--good); } #feedback.bad { color: var(--bad); }
  #explain { display: none; }
  /* 阅读理解：先整屏读短文，读完再答题；上下键滚动 */
  #passage { display: none; font-size: 32px; line-height: 1.55; white-space: pre-line; max-height: 640px; overflow: auto;
    margin-top: 8px; }
  #card.reading #passage { display: block; }
  #card.reading #stem { display: none; }
  #done, #reread { display: none; }
  #skip { font-size: 26px; padding: 12px 24px; opacity: .85; }
  #hint { margin-top: auto; font-size: 22px; color: var(--muted); }

  /* 答对的彩纸 */
  .confetti { position: fixed; top: -30px; width: 18px; height: 28px; border-radius: 4px; pointer-events: none;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(1150px) rotate(720deg); opacity: .8; } }
  .gbar { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: #ffd166; border-radius: 4px; }
  #vplay iframe { pointer-events: none; }
  #vlist, #vplay { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 50; background: #05070f; display: none; }
  #vlist { overflow: auto; padding: 40px; box-sizing: border-box; }
  .vq { font-size: 40px; color: #e8f4ff; margin: 0 0 24px; }
  .vgrid { display: flex; flex-wrap: wrap; }
  .vgrid button.vcard { position: relative; width: 31%; margin: 0 1% 24px; padding: 8px; text-align: center; font-size: 22px; }
  .vcard img { display: block; width: 100%; border-radius: 8px; }
  .vcard span { display: block; height: 58px; overflow: hidden; margin-top: 6px; }
  .vcard b { position: absolute; left: 14px; top: 14px; font-size: 40px; }
  #vlist button { display: block; width: 100%; margin: 0 0 12px; text-align: left; }
</style>
</head>

<script>
  // 只用 ES2017，兼容 2022 款三星电视浏览器
  var LETTERS = ["A", "B", "C", "D"];
  // 界面语言由电脑在发页面时填进来（[quiz] language）
  var I18N = {
    zh: {
      title: "答题解锁", robot: "小 Robo", connecting: "正在连接…", next: "下一题 ➜", tip: "💡 提示", read: "🔊 读题", explain: "🤖 讲一讲", more: "顺便说一句：",
      unlocked: "已解锁！按遥控器上的 ⌂ 主页键继续看电视。",
      hint: "方向键选择，确认键作答；数字键 1–4 直接选 A–D。",
      balance: "余额", minutes: "分钟", usedToday: "今日已用", earned: "答题赚得",
      diffs: { easy: "简单", medium: "中等", hard: "困难" },
      wrongMinus: "答错 -", wrongFree: "答错不扣",
      offline: "连不上电脑，请稍后再试", waiting: "连接不上电脑，请稍等…",
      noTip: "仔细读题，一步一步想。你可以的！", tipIntro: "小提示：",
      cheer: ["太棒了！", "你真聪明！", "完全正确！", "厉害！"], comfort: ["没关系，我们一起看看。", "差一点点！听我讲讲。"],
      streak: "连对 ",
      done: "读完了，开始答题 ➜", reread: "📖 再看文章", skip: "⏭ 不会，跳过", readFirst: "先把文章读完，再按「读完了」。",
      skipWait: "看完讲解再继续，还有 "
    },
    de: {
      title: "Quiz-Pause", robot: "Robo", connecting: "Verbinde …", next: "Weiter ➜", tip: "💡 Tipp", read: "🔊 Vorlesen", explain: "🤖 Erklär mal", more: "Übrigens: ",
      unlocked: "Freigeschaltet! Drücke die ⌂ Home-Taste, um weiterzuschauen.",
      hint: "Pfeiltasten zum Auswählen, OK zum Antworten – oder Zifferntasten 1–4 für A–D.",
      balance: "Guthaben", minutes: "Min.", usedToday: "heute genutzt", earned: "erspielt",
      diffs: { easy: "Leicht", medium: "Mittel", hard: "Schwer" },
      wrongMinus: "falsch: -", wrongFree: "falsch: kein Abzug",
      offline: "Keine Verbindung zum Computer – bitte gleich noch einmal versuchen.",
      waiting: "Keine Verbindung zum Computer, bitte warten …",
      noTip: "Lies die Frage ganz genau und denk Schritt für Schritt. Du schaffst das!", tipIntro: "Mein Tipp: ",
      cheer: ["Super gemacht!", "Klasse!", "Genau richtig!", "Du bist ein Profi!"],
      comfort: ["Nicht schlimm, schauen wir es uns zusammen an.", "Knapp daneben! Ich erkläre es dir."],
      streak: "Serie ",
      done: "Fertig gelesen ➜", reread: "📖 Text nochmal", skip: "⏭ Weiß nicht – überspringen",
      readFirst: "Lies zuerst den Text und drücke dann „Fertig gelesen“.", skipWait: "Erst die Erklärung lesen, noch "
    }
  };
  var LANG = "__LANG__";
  var T = I18N[LANG] || I18N.zh;
  var difficulty = "medium";
  var question = null;
  var answered = false;
  var state = null;
  var streak = 0;
  var audio = null;
  var lastResult = null;
  var shownAt = 0;
  var passageGroup = null;

  function $(id) { return document.getElementById(id); }
  function pickOne(list) { return list[Math.floor(Math.random() * list.length)]; }

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json(); });
  }

  // 只在讲解时请出小机器人：滑出来，气泡里显示文字并读出来，读的时候嘴巴动
  function robotSay(text, spoken) {
    document.body.classList.add("robot");
    $("say").textContent = text;
    speak(spoken || text);
  }

  // 答错时随机换一个小伙伴来讲解；球星都是虚构的卡通形象
  var BUDDIES = [["c-robot", null], ["c-dino", "Rexi"], ["c-kicker", "Kicker Leo"], ["c-baller", "Korb-Kai"]];

  function setBuddy(b) {
    BUDDIES.forEach(function (x) { $(x[0]).style.display = x === b ? "" : "none"; });
    $("robotName").textContent = b[1] || T.robot;
  }

  function hideRobot() {
    setBuddy(BUDDIES[0]);
    document.body.classList.remove("robot");
    stopAudio();
  }

  function stopAudio() {
    if (audio) { audio.pause(); audio = null; }
    $("robot").classList.remove("talking");
  }

  function feedback(text, cls) {
    $("feedback").className = cls || "";
    $("feedback").textContent = text || "";
  }

  function speak(text) {
    stopAudio();
    var robot = $("robot");
    var a = new Audio("/api/tts?text=" + encodeURIComponent(text));
    audio = a;
    a.onplaying = function () { if (audio === a) robot.classList.add("talking"); };
    a.onended = a.onerror = a.onpause = function () { if (audio === a) robot.classList.remove("talking"); };
    var p = a.play();
    if (p && p.catch) p.catch(function () { robot.classList.remove("talking"); });
  }

  function mood(name) {
    var robot = $("robot");
    robot.classList.remove("happy", "sad");
    void robot.offsetWidth;  // 重新触发动画
    if (name) robot.classList.add(name);
  }

  function confetti() {
    var colors = ["#ff8fab", "#7fd8ff", "#ffd166", "#8ef0a8", "#c3a6ff"];
    for (var i = 0; i < 40; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = pickOne(colors);
      c.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
      c.style.animationDelay = Math.random() * 0.4 + "s";
      document.body.appendChild(c);
      setTimeout(function (el) { el.remove(); }, 3600, c);
    }
  }

  function renderState(s) {
    state = s;
    var html = T.balance + " <b>" + s.remaining + "</b> " + T.minutes + "<br>" + T.usedToday + " " + s.used + "/" + s.limit;
    if (s.earnedToday) html += " · " + T.earned + " " + s.earnedToday;
    $("status").innerHTML = html;
    $("unlocked").style.display = s.locked ? "none" : "block";
    renderDiffs();
  }

  function renderStreak() {
    var n = Math.min(streak, 10);
    $("stars").textContent = streak ? T.streak + streak + " " + new Array(n + 1).join("★") : "";
  }

  function renderDiffs() {
    var box = $("diffs");
    var focusedDiff = document.activeElement && document.activeElement.dataset.diff;
    box.innerHTML = "";
    [["easy", T.diffs.easy], ["medium", T.diffs.medium], ["hard", T.diffs.hard]].forEach(function (d) {
      var b = document.createElement("button");
      b.className = "nav diff" + (d[0] === difficulty ? " sel" : "");
      b.dataset.diff = d[0];
      var reward = state ? state.rewards[d[0]] : "?";
      var pen = state ? (state.penalties ? state.penalties[d[0]] : (d[0] === "easy" ? state.penaltyEasy : 0)) : "?";
      var wrong = pen ? T.wrongMinus + pen : T.wrongFree;
      b.innerHTML = d[1] + " +" + reward + " " + T.minutes + "<small>" + wrong + "</small>";
      b.onclick = function () { difficulty = d[0]; renderDiffs(); loadQuestion(); };
      box.appendChild(b);
      if (focusedDiff === d[0]) b.focus();
    });
  }

  function offline() {
    feedback(T.offline, "bad");
  }

  function loadQuestion() {
    answered = false;
    lastResult = null;
    hideRobot();
    mood(null);
    feedback("");
    $("explain").style.display = "none";
    api("POST", "/api/question", { difficulty: difficulty }).catch(function () {
      offline();
      setTimeout(loadQuestion, 5000);  // 电脑恢复后自动接着出题
      return { error: "" };
    }).then(function (q) {
      if (q.error === "") return;
      if (q.error) { feedback(q.error, "bad"); return; }
      question = q;
      shownAt = new Date().getTime();
      $("meta").textContent = q.subject + (q.passage ? " · " + q.title : " · " + q.difficultyLabel);
      $("stem").textContent = q.stem;
      $("passage").textContent = q.passage || "";
      $("reread").style.display = q.passage ? "inline-block" : "none";
      $("skip").style.display = "";
      var newText = q.passage && q.group !== passageGroup;
      passageGroup = q.passage ? q.group : null;
      var box = $("options");
      box.innerHTML = "";
      q.options.forEach(function (text, i) {
        var b = document.createElement("button");
        b.className = "nav opt";
        b.dataset.choice = i;
        b.innerHTML = '<span class="k">' + LETTERS[i] + "</span>";
        b.appendChild(document.createTextNode(text));
        b.onclick = function () { answer(i); };
        box.appendChild(b);
      });
      if (newText) showText(true); else { showText(false); box.firstChild.focus(); }
    });
  }

  // 阅读理解：整屏显示短文（隐藏题目和选项），读完按「读完了」
  function showText(on) {
    $("card").classList.toggle("reading", on);
    $("options").style.display = on ? "none" : "";
    $("done").style.display = on ? "inline-block" : "none";
    if (on) { $("passage").scrollTop = 0; $("done").focus(); }
  }

  function textDone() {
    showText(false);
    if (answered) $("next").focus(); else if ($("options").firstChild) $("options").firstChild.focus();
  }

  // 不会/超纲：不加不扣，显示正确答案并讲解，倒计时结束才能下一题
  function skipQuestion() {
    if (!question || answered) return;
    answered = true;
    api("POST", "/api/skip", { id: question.id }).then(function (r) {
      if (r.error) { answered = false; feedback(r.error, "bad"); return; }
      showText(false);
      $("options").children[r.answer].classList.add("good");
      lastResult = r;
      $("skip").style.display = "none";
      $("explain").style.display = "";
      var until = new Date().getTime() + r.wait * 1000;
      nextAllowed = until;
      mood(null);
      explain(r, r.message);
      var tick = function () {
        var left = Math.ceil((until - new Date().getTime()) / 1000);
        if (lastResult !== r) return;
        if (left > 0) { feedback(T.skipWait + left + " s", "bad"); setTimeout(tick, 1000); }
        else feedback("");
      };
      tick();
      $("next").focus();
    }).catch(function () { answered = false; offline(); });
  }

  function readQuestion() {
    if (!question) return;
    var spoken = question.stem + " " + question.options.map(function (o, i) { return LETTERS[i] + ": " + o; }).join(". ");
    speak(spoken);  // 只读题，不请机器人
  }

  function showTip() {
    if (!question) return;
    mood(null);
    robotSay(T.tipIntro + (question.hint || T.noTip));
  }

  // 讲解：答案解释 + 引申的相关知识
  function explain(r, intro) {
    var text = (intro ? intro + "\n" : "") + (r.explanation || "");
    if (r.more) text += "\n" + T.more + r.more;
    robotSay(text);
  }

  function answer(choice) {
    if (!question || answered || new Date().getTime() - shownAt < 600) return;
    answered = true;
    api("POST", "/api/answer", { id: question.id, choice: choice }).then(function (r) {
      if (r.error) { answered = false; feedback(r.error, "bad"); return; }
      $("skip").style.display = "none";
      var buttons = $("options").children;
      buttons[r.answer].classList.add("good");
      if (!r.correct) buttons[choice].classList.add("bad");
      lastResult = r;
      nextAllowed = new Date().getTime() + (r.correct ? 800 : 2500);  // 确定键松开时焦点已到「下一题」，不能让它连带跳过去
      sinceVideo += 1;
      if (r.correct) {
        // 答对：不打扰，只有彩纸和一行字；想听讲解可以按「讲一讲」
        streak += 1;
        confetti();
        feedback("✓ " + pickOne(T.cheer) + " " + r.message, "good");
        if (r.explanation || r.more) $("explain").style.display = "";
      } else {
        streak = 0;
        feedback("✗ " + r.message, "bad");
        setBuddy(pickOne(BUDDIES));
        mood("sad");
        explain(r, pickOne(T.comfort));
      }
      renderStreak();
      renderState(r.state);
      $("next").focus();
    }).catch(function () {
      answered = false;  // 没送到电脑：这题还能再答
      offline();
    });
  }

  // 方向键在可选元素之间按位置移动焦点
  function move(dx, dy) {
    var items = Array.prototype.slice.call(document.querySelectorAll(".nav"))
      .filter(function (el) { return el.offsetParent !== null; });
    var cur = document.activeElement;
    if (items.indexOf(cur) < 0) { items[0].focus(); return; }
    var a = cur.getBoundingClientRect();
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var best = null, bestScore = Infinity;
    items.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var bx = b.left + b.width / 2, by = b.top + b.height / 2;
      var along = dx ? (bx - ax) * dx : (by - ay) * dy;
      var across = dx ? Math.abs(by - ay) : Math.abs(bx - ax);
      if (along <= 4) return;
      // 同一行/列的优先，否则远处的 A→B 会输给下面离得近的按钮
      var sameLine = dx ? (b.top < a.bottom && b.bottom > a.top) : (b.left < a.right && b.right > a.left);
      if (dx && !sameLine) return;
      var score = along + across * 2 + (sameLine ? 0 : 100000);
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) best.focus();
  }

  // 确定键松开时，浏览器会再「点」一下当时的焦点；换题后焦点已在 A，会替孩子选 A
  ["keyup", "keypress"].forEach(function (type) {
    document.addEventListener(type, function (e) { if (e.keyCode === 13) e.preventDefault(); });
  });

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (e.repeat && (k === 13 || (k >= 49 && k <= 52))) { e.preventDefault(); return; }  // 按久了不算连按
    if (playing) { endVideo(); e.preventDefault(); return; }  // 放视频时遥控器任意键都退出
    if (k === 10009 && videoOpen) { closeVideos(); e.preventDefault(); return; }
    var reading = $("card").classList.contains("reading");
    if (reading && (k === 38 || k === 40)) { $("passage").scrollTop += k === 40 ? 160 : -160; e.preventDefault(); return; }
    if (reading && k >= 49 && k <= 52) { e.preventDefault(); return; }
    if (k === 37) move(-1, 0);
    else if (k === 39) move(1, 0);
    else if (k === 38) move(0, -1);
    else if (k === 40) move(0, 1);
    else if (k === 13) { if (document.activeElement && document.activeElement.click) document.activeElement.click(); }
    else if (k >= 49 && k <= 52) answer(k - 49);
    else return;
    e.preventDefault();
  });

  $("next").onclick = nextStep;
  $("done").onclick = textDone;
  $("reread").onclick = function () { showText(true); };
  $("skip").onclick = skipQuestion;
  $("tip").onclick = showTip;
  $("read").onclick = readQuestion;
  $("explain").onclick = function () { if (lastResult) { mood("happy"); explain(lastResult); } };

  // 心跳：告诉电脑「答题页还在前台」；切走后浏览器会暂停脚本，电脑据此把页面重新打开
  function heartbeat() {
    if (document.visibilityState !== "visible") return;
    api("POST", "/api/heartbeat").then(renderState).catch(function () {
      $("status").textContent = T.waiting;
    });
  }

  // 手势：平板摄像头看手。食指指方向移动焦点，张开手掌保持住就是「确定」；放下手才能再次确定
  var HOLD_MS = 1500, MOVE_MS = 400, REPEAT_MS = 1200;
  var bar = document.createElement("div");
  bar.className = "gbar";
  var held = { n: 0, since: 0, moved: 0, armed: true, live: false };
  var DIRS = { 11: [0, -1], 12: [0, 1], 13: [-1, 0], 14: [1, 0] };

  function clearBar() { if (bar.parentNode) bar.parentNode.removeChild(bar); }

  function onGesture(n) {
    var now = new Date().getTime();
    if (n !== held.n) { held.n = n || 0; held.since = now; held.moved = 0; clearBar(); }
    if (!n) { held.armed = true; return; }
    if (DIRS[n]) {
      held.armed = true;
      // 指稳一小会儿才动，一直指着就隔一段时间再走一格
      if (now - held.since >= MOVE_MS && now - held.moved >= REPEAT_MS) {
        held.moved = now;
        move(DIRS[n][0], DIRS[n][1]);
      }
      return;
    }
    var target = document.activeElement;
    if (n !== 5 || !held.armed || !target || !target.click || target === document.body) return;
    target.style.position = "relative";
    target.appendChild(bar);
    bar.style.width = Math.min(100, (now - held.since) / HOLD_MS * 100) + "%";
    if (now - held.since >= HOLD_MS) {
      held.armed = false;
      clearBar();
      target.click();
    }
  }

  function pollGesture() {
    if (document.visibilityState !== "visible" || videoOpen) return;
    api("GET", "/api/gesture").then(function (g) {
      var live = g.fingers !== null;
      if (live !== held.live) { held.live = live; $("hint").textContent = T.hint + (live ? " · ☝ ← ↑ ↓ → · ✋ OK" : ""); }
      onGesture(g.fingers);
    }).catch(function () {});
  }

  // 科普视频：只列家长批准的；后台负责开网、到点断网，并把答题页重新打开
  var videoOpen = false;
  var playing = false;
  var VIDEO_EVERY = 5;  // 每答这么多题插一个带闯关题的视频
  var sinceVideo = 0;
  var nextAllowed = 0;
  var starting = false;  // 开网要几秒，这期间多按确定不重复开始

  function videoRow(label, fn) {
    var b = document.createElement("button");
    b.className = "nav opt";
    b.textContent = label;
    b.onclick = fn;
    $("vlist").appendChild(b);
    return b;
  }

  function closeVideos() {
    videoOpen = false;
    $("vlist").style.display = "none";
    $("next").focus();
  }

  function openVideos() {
    api("GET", "/api/videos").then(function (r) {
      videoOpen = true;
      $("vlist").innerHTML = "";
      $("vlist").style.display = "block";
      var back = videoRow("← Zurück", closeVideos);
      var grid = document.createElement("div");
      grid.className = "vgrid";
      $("vlist").appendChild(grid);
      r.videos.forEach(function (v) {
        var b = document.createElement("button");
        b.className = "nav opt vcard";
        var img = document.createElement("img");
        img.src = "/api/thumb/" + v.id;
        b.appendChild(img);
        var label = document.createElement("span");
        label.textContent = v.title.split(" | ")[0] + " · " + Math.ceil(v.seconds / 60) + " min";
        b.appendChild(label);
        if (v.quiz) { var star = document.createElement("b"); star.textContent = "⭐"; b.appendChild(star); }
        b.onclick = function () { playVideo(v); };
        grid.appendChild(b);
      });
      back.focus();
    }).catch(offline);
  }

  function endVideo() {
    api("POST", "/api/video/stop").then(function () { location.reload(); }, function () { location.reload(); });
  }

  // 看完闯关：只给星星，不加时间，免得反复刷同一个视频
  function finishVideo(v) {
    if (!v.quiz) { endVideo(); return; }
    playing = false;
    api("POST", "/api/video/stop", { stay: true }).catch(function () {});
    $("vplay").style.display = "none";
    $("vlist").style.display = "block";
    videoQuestion(v, 0, 0);
  }

  function videoQuestion(v, i, stars) {
    var box = $("vlist");
    box.innerHTML = "";
    if (i >= v.quiz.length) {
      var done = document.createElement("div");
      done.className = "vq";
      done.textContent = new Array(stars + 1).join("★") + new Array(v.quiz.length - stars + 1).join("☆") + "  " + stars + " / " + v.quiz.length;
      box.appendChild(done);
      if (stars === v.quiz.length) confetti();
      videoRow("Weiter →", endVideo).focus();
      return;
    }
    var q = v.quiz[i], title = document.createElement("div");
    title.className = "vq";
    title.textContent = (i + 1) + " / " + v.quiz.length + "  " + q.stem;
    box.appendChild(title);
    var buttons = q.options.map(function (text, c) {
      return videoRow(LETTERS[c] + "  " + text, function () {
        if (buttons.answered) return;
        buttons.answered = true;
        var right = c === q.answer;
        buttons[q.answer].classList.add("good");
        if (!right) buttons[c].classList.add("bad");
        var note = document.createElement("div");
        note.className = "vq";
        note.textContent = q.explanation;
        box.appendChild(note);
        videoRow("Weiter →", function () { videoQuestion(v, i + 1, stars + (right ? 1 : 0)); }).focus();
      });
    });
    buttons[0].focus();
  }

  function loadPlayer(v, tries) {
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = function () {  // 路由器开网要几秒
      if (tries > 0) setTimeout(function () { loadPlayer(v, tries - 1); }, 3000);
      else endVideo();
    };
    window.onYouTubeIframeAPIReady = function () {
      new YT.Player("vplayer", { videoId: v.id, width: "100%", height: "100%",
        playerVars: { autoplay: 1, playsinline: 1, rel: 0, controls: 0, disablekb: 1 },
        events: {
          onReady: function (e) {
            e.target.playVideo();
            // 还是没播起来就静音再试（静音通常允许自动播放）
            setTimeout(function () {
              if (e.target.getPlayerState() !== 1) { e.target.mute(); e.target.playVideo(); }
            }, 6000);
          },
          onStateChange: function (e) { if (e.data === 0) finishVideo(v); },
          onError: endVideo
        } });
    };
    document.head.appendChild(s);
  }

  function playVideo(v) {
    if (playing || starting) return;
    starting = true;
    api("POST", "/api/video/start", { id: v.id }).then(function (r) {
      starting = false;
      if (r.error) { closeVideos(); feedback(r.error, "bad"); return; }
      $("vlist").style.display = "none";
      $("vplay").style.display = "block";
      playing = true;
      // 焦点进了 YouTube 的 iframe，遥控器按键就到不了这个页面，所以一直抢回来
      setInterval(function () { window.focus(); }, 500);
      stopAudio();
      setTimeout(function () { loadPlayer(v, 5); }, 3000);
    }).catch(function () { starting = false; offline(); });
  }

  $("videos").onclick = openVideos;

  // 电视不让没按过键的页面自动播放（实测只显示封面），所以先让孩子按一下确定
  function videoIntro(v) {
    var box = $("vlist");
    videoOpen = true;
    box.innerHTML = "";
    box.style.display = "block";
    var title = document.createElement("div");
    title.className = "vq";
    title.textContent = "🎬 Video-Frage: " + v.title.split(" | ")[0];
    box.appendChild(title);
    videoRow("▶ Start", function () { playVideo(v); }).focus();
    videoRow("Überspringen →", function () { closeVideos(); loadQuestion(); });
  }

  // 今天没看过、额度也够的闯关视频，没有就接着出普通题
  function nextStep() {
    if (new Date().getTime() < nextAllowed) return;
    if (sinceVideo < VIDEO_EVERY) { loadQuestion(); return; }
    sinceVideo = 0;
    api("GET", "/api/videos").then(function (r) {
      var fresh = r.videos.filter(function (v) { return v.quiz && r.seen.indexOf(v.id) < 0; });
      if (fresh.length) videoIntro(pickOne(fresh));
      else loadQuestion();
    }).catch(loadQuestion);
  }

  // 背景星星
  for (var i = 0; i < 40; i++) {
    var s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.animationDelay = Math.random() * 3 + "s";
    $("sky").appendChild(s);
  }

  $("title").textContent = T.title;
  $("robotName").textContent = T.robot;
  $("status").textContent = T.connecting;
  $("next").textContent = T.next;
  $("tip").textContent = T.tip;
  $("read").textContent = T.read;
  $("explain").textContent = T.explain;
  $("done").textContent = T.done;
  $("reread").textContent = T.reread;
  $("skip").textContent = T.skip;
  $("unlocked").textContent = T.unlocked;
  $("hint").textContent = T.hint;

  api("GET", "/api/state").then(renderState).catch(function () {
    $("status").textContent = T.waiting;
  }).then(loadQuestion);
  setInterval(heartbeat, 4000);
  setInterval(pollGesture, 250);
</script>
<div id="vlist"></div>
<div id="vplay"><div id="vplayer"></div></div>
</body>
</html>
