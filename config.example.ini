; 复制为 config.local.ini 再填写。config.local.ini 含密码，已被 .gitignore 排除
; Copy to config.local.ini and fill in. config.local.ini holds passwords and is git-ignored.
[fritzbox]
address = 192.168.178.1
; FRITZ!Box 上专门建的用户（需要「FRITZ!Box 设置」权限）
user = homecontrol
password =

; 受管控的设备：名字 = MAC 地址（运行 python -m homecontrol devices 找 MAC）
[devices]
tv = 00:00:00:00:00:00
; switch = 00:00:00:00:00:00
; ipad = 00:00:00:00:00:00

[limits]
; 受管控设备合计的每日上限（分钟）
daily_minutes = 60
; 超时后每隔几分钟重新接管一次电视
repeat_minutes = 5
; 计时的设备，逗号分隔
track = tv

[reminder]
text = 你今天已经玩了一个小时了。眼睛需要休息，把游戏放下，去做点别的吧。
voice = zh-CN-YunyangNeural
avatar =
voice_file =

[monitor]
; 可选：心跳地址（如 healthchecks.io 的 ping URL），tools/run_pad.sh 每 5 分钟上报一次；停了由该服务发提醒
heartbeat_url =

[quiz]
# 时间用完后电视进入答题屏保（断外网 + 打开答题页）；false 则仍用提醒视频
enabled = true
port = 8767
# 电视上的答题应用 ID（tools/build_tv_app.py 安装后生效）
tv_app = ShuaTiQz01.QuizLock
# 答对奖励 / 简单题答错扣（分钟）
reward_easy = 2
reward_medium = 4
reward_hard = 8
penalty_easy = 2
# 每天最多靠答题加多少分钟；扣时最多把余额扣到多少
daily_earn_cap = 60
min_balance = -30
min_answer_seconds = 3
# 题目语言/教材：de = 德国小学（德语题），zh = 中国初中（中文题）
language = de
# de：1–4 = Klasse 1–4；科目可选 mathe, deutsch, sachunterricht, englisch, franzoesisch, englisch_alltag
# （franzoesisch、englisch_alltag 是 8–9 年级日常对话，不受 grade 限制）
# zh：7=初一 8=初二 9=初三；科目可选 math, english, chinese
grade = 4
subjects = mathe, deutsch, sachunterricht, englisch
# 题库目录（不填用默认：de → assets/quiz_bank_de）。JSON 改了不用重启
# bank_dir =
