<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Quiz</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; color: #e8f4ff;
    font-family: "Samsung One", sans-serif; display: flex; align-items: center; justify-content: center; }
  #msg { font-size: 48px; text-align: center; line-height: 1.6; }
  small { font-size: 28px; color: #8ea3c0; }
</style>
</head>
<body>
<div id="msg">Quiz wird geladen …<br><small id="detail"></small></div>
<script>
  // 构建时由 tools/build_tv_app.py 替换成电脑的局域网地址
  var QUIZ = "__QUIZ_URL__";

  // 数字键 1–4 默认不会发给网页，要先登记（方向键和确认键不用）
  try {
    ["1", "2", "3", "4"].forEach(function (k) { tizen.tvinputdevice.registerKey(k); });
  } catch (e) { /* 在电脑浏览器里预览时没有 tizen 对象 */ }

  // 服务地址可能变（平板重启后 DHCP 换了 IP）：先试上次成功的，不行就扫同一网段
  var m = QUIZ.match(/^http:\/\/(\d+\.\d+\.\d+\.)(\d+)(:\d+)\/quiz$/);
  var saved = null;
  try { saved = localStorage.getItem("quizUrl"); } catch (e) {}

  function probe(url) {
    return new Promise(function (ok, fail) {
      var done = setTimeout(fail, 1500);
      fetch(url.replace(/\/quiz$/, "/api/state"), { cache: "no-store" }).then(function (r) {
        clearTimeout(done);
        if (r.ok) ok(url); else fail();
      }, fail);
    });
  }

  function go(url) {
    try { localStorage.setItem("quizUrl", url); } catch (e) {}
    location.replace(url);
  }

  function scan(host, found) {
    if (host > 254) { found(null); return; }
    var batch = [], stop = false;
    for (var h = host; h < host + 40 && h <= 254; h++) {
      batch.push(probe("http://" + m[1] + h + m[3] + "/quiz").then(function (u) {
        if (!stop) { stop = true; found(u); }
      }, function () {}));
    }
    Promise.all(batch).then(function () { if (!stop) scan(host + 40, found); });
  }

  function tryOpen() {
    probe(saved || QUIZ).then(go, function () {
      return probe(QUIZ).then(go);
    }).catch(function () {
      document.getElementById("detail").textContent = "Suche Quiz-Server …";
      scan(2, function (u) {
        if (u) { go(u); return; }
        document.getElementById("detail").textContent = "Quiz-Server nicht gefunden, neuer Versuch in 5 Sekunden";
        setTimeout(tryOpen, 5000);
      });
    });
  }
  tryOpen();
</script>
</body>
</html>
